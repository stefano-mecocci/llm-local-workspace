@if (open()) {
<aside class="absolute left-0 top-0 z-30 flex h-full flex-col overflow-hidden bg-zinc-900 sm:relative"
  animate.enter="sidebar-enter" animate.leave="sidebar-leave">
  <div class="flex h-full w-64 flex-col">
    <div class="flex items-center justify-between p-4">
      <span class="text-sm font-semibold text-zinc-200">Chats</span>

      <!-- Close button -->
      <button pButton iconOnly severity="secondary" variant="text" aria-label="Close sidebar" (click)="close()"><svg
          data-p-icon="times"></svg></button>

    </div>

    <div class="grid grid-cols-2 gap-x-2 mx-4">
      <a pButton routerLink="/" class="col-span-1"><svg data-p-icon="home"></svg> Home</a>

      @if (!isRootRoute()) {
      <button pButton class="col-span-1" (click)="openNewChat()"><svg data-p-icon="plus"></svg>New chat</button>
      }
    </div>

    <nav class="flex-1 overflow-y-auto p-4 flex flex-col gap-y-4">
      @for (chatId of chatIds.value(); track chatId) {
      <a pButton variant="text" severity="secondary" [routerLink]="['chat', chatId]" routerLinkActive="bg-zinc-700!"
        class="text-zinc-200!">{{
        chatId }}</a>
      }
    </nav>
  </div>
</aside>
} @else {
<div class="fixed left-4 top-4 z-10">
  <button pButton iconOnly severity="secondary" size="large" aria-label="Open sidebar" (click)="show()"
    animate.enter="button-enter" animate.leave="button-leave"><svg data-p-icon="bars"></svg></button>
</div>
}
