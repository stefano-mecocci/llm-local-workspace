@if (open()) {
  <aside class="flex h-full w-64 flex-col border-r border-gray-200 bg-gray-50">
    <div class="flex items-center justify-between p-4">
      <span class="text-sm font-semibold text-gray-700">Chats</span>
      <button
        type="button"
        class="cursor-pointer rounded-md p-1 text-gray-500 hover:bg-gray-200 hover:text-gray-700"
        (click)="close()"
        aria-label="Close sidebar"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="h-5 w-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
    <nav class="flex-1 overflow-y-auto p-4"></nav>
  </aside>
} @else {
  <button
    type="button"
    class="fixed left-4 top-4 z-50 cursor-pointer rounded-md border border-gray-200 bg-white p-2 text-gray-700 shadow hover:bg-gray-100"
    (click)="show()"
    aria-label="Open sidebar"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="h-5 w-5"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
      />
    </svg>
  </button>
}
