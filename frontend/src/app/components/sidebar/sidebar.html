@if (open()) {
<div class="fixed inset-0 z-20 bg-black/70 sm:hidden" animate.enter="overlay-enter" animate.leave="overlay-leave"
  (click)="close()"></div>
<aside
  class="absolute left-0 top-0 z-30 flex h-full flex-col border-r border-zinc-700 overflow-hidden bg-zinc-900 sm:relative"
  animate.enter="sidebar-enter" animate.leave="sidebar-leave">
  <div class="flex h-full w-64 flex-col gap-5">
    <div class="flex items-center justify-between p-4">
      <span class="font-semibold text-zinc-200">Chats</span>

      <!-- Close button -->
      <button size="large" pButton iconOnly severity="secondary" variant="text" aria-label="Close sidebar"
        (click)="close()"><svg data-p-icon="times"></svg></button>

    </div>

    <div class="mx-4">
      @if (!isRootRoute()) {
      <a pButton routerLink="/" fluid (click)="close()" size="large"><svg data-p-icon="plus"></svg>New chat</a>
      }
    </div>

    <nav class="flex-1 overflow-y-auto p-4 flex flex-col gap-y-4">
      @for (chatId of chatIds.value(); track chatId) {
      <a pButton size="large" variant="text" severity="secondary" [routerLink]="['chat', chatId]"
        routerLinkActive="bg-zinc-700!" class="text-zinc-200!">{{
        chatId }}</a>
      }
    </nav>
  </div>
</aside>
} @else {
<div class="fixed left-4 top-4 z-20">
  <button pButton iconOnly severity="secondary" size="large" aria-label="Open sidebar" (click)="show()"
    animate.enter="button-enter" animate.leave="button-leave"><svg data-p-icon="bars"></svg></button>
</div>
}
