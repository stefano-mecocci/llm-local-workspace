@if (open()) {
<aside class="absolute left-0 top-0 z-30 flex h-full flex-col overflow-hidden bg-zinc-900 sm:relative"
  animate.enter="sidebar-enter" animate.leave="sidebar-leave">
  <div class="flex h-full w-64 flex-col">
    <div class="flex items-center justify-between p-4">
      <span class="text-sm font-semibold text-zinc-200">Chats</span>

      <!-- Close button -->
      <button type="button" class="btn-icon text-zinc-200 hover:bg-zinc-800" (click)="close()"
        aria-label="Close sidebar">
        <i class="fa fa-times"></i>
      </button>

    </div>
    <nav class="flex-1 overflow-y-auto p-4"></nav>
  </div>
</aside>
} @else {
<button type="button"
  class="fixed left-4 top-4 z-50 btn-icon rounded-md border border-zinc-500 bg-zinc-700 text-zinc-200 shadow hover:bg-zinc-600"
  (click)="show()" aria-label="Open sidebar" animate.enter="button-enter" animate.leave="button-leave">
  <i class="fa fa-bars"></i>
</button>
}
