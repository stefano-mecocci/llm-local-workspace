@if (open()) {
<aside class="absolute left-0 top-0 z-30 flex h-full flex-col overflow-hidden bg-zinc-900 sm:relative"
  animate.enter="sidebar-enter" animate.leave="sidebar-leave">
  <div class="flex h-full w-64 flex-col">
    <div class="flex items-center justify-between p-4">
      <span class="text-sm font-semibold text-zinc-200">Chats</span>

      <!-- Close button -->
      <button type="button" class="cursor-pointer rounded-md p-1 text-gray-500 hover:bg-zinc-700 hover:text-zinc-200"
        (click)="close()" aria-label="Close sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

    </div>
    <nav class="flex-1 overflow-y-auto p-4"></nav>
  </div>
</aside>
} @else {
<button type="button"
  class="fixed left-4 top-4 z-50 cursor-pointer rounded-md border border-zinc-500 bg-zinc-700 p-2 text-zinc-200 shadow hover:bg-zinc-600"
  (click)="show()" aria-label="Open sidebar" animate.enter="button-enter" animate.leave="button-leave">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
    class="size-5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
  </svg>
</button>
}
